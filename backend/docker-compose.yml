# Local development. Mirrors the Render container as closely as possible.
#   docker compose up --build
# Then open the frontend with API_BASE_URL pointing at http://localhost:10000
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dot-matrix-ocr-api
    container_name: dot-matrix-ocr-api
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      # Read from your shell or a local .env file (never commit .env).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OCR_MODEL: ${OCR_MODEL:-openrouter/free}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:10000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
